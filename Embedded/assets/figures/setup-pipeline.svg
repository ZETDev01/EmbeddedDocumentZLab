<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="600" y="56" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle" fill="#111111">Setup Pipeline</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="70" y="150" width="180" height="100" rx="16" fill="#f8f8f8" stroke="#111111" stroke-width="2"/>
    <text x="160" y="208" font-size="21" fill="#111111">Install IDE</text>

    <rect x="300" y="150" width="180" height="100" rx="16" fill="#f8f8f8" stroke="#111111" stroke-width="2"/>
    <text x="390" y="208" font-size="21" fill="#111111">Add PlatformIO</text>

    <rect x="530" y="150" width="180" height="100" rx="16" fill="#f8f8f8" stroke="#111111" stroke-width="2"/>
    <text x="620" y="208" font-size="21" fill="#111111">Connect Board</text>

    <rect x="760" y="150" width="180" height="100" rx="16" fill="#f8f8f8" stroke="#111111" stroke-width="2"/>
    <text x="850" y="208" font-size="21" fill="#111111">Open Sample</text>

    <rect x="990" y="150" width="140" height="100" rx="16" fill="#f8f8f8" stroke="#111111" stroke-width="2"/>
    <text x="1060" y="194" font-size="21" fill="#111111">Build</text>
    <text x="1060" y="224" font-size="21" fill="#111111">Upload</text>
  </g>
  <line x1="250" y1="200" x2="300" y2="200" stroke="#111111" stroke-width="3"/>
  <polygon points="300,200 286,192 286,208" fill="#111111"/>
  <line x1="480" y1="200" x2="530" y2="200" stroke="#111111" stroke-width="3"/>
  <polygon points="530,200 516,192 516,208" fill="#111111"/>
  <line x1="710" y1="200" x2="760" y2="200" stroke="#111111" stroke-width="3"/>
  <polygon points="760,200 746,192 746,208" fill="#111111"/>
  <line x1="940" y1="200" x2="990" y2="200" stroke="#111111" stroke-width="3"/>
  <polygon points="990,200 976,192 976,208" fill="#111111"/>
  <text x="600" y="320" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#333333">Rule: finish Build before Upload, finish Upload before Monitor</text>
</svg>
