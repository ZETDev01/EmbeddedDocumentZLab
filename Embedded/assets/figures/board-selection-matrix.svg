  <text x="890" y="240" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#333333">Use ST-LINK for upload</text>
  <text x="890" y="275" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" fill="#333333">Use USB-UART for monitor</text>
